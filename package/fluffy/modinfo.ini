name=TLOU Outfit Changer
version=v1.0.0
description=Wear any Joel and Ellie outfit, plus the weapon skins, without finishing the story. Extras > Skins and the in-game Skins menu are open on any save, and every skin is already owned, so you spend no points. It uses the game's own skin menus; no model files are replaced, and your saves and points are never edited. Gameplay Modifiers and trophies stay as they are. Works alongside TLOU Infinite Ammo (this mod loads as xinput1_4.dll, Infinite Ammo as version.dll). Settings: TLOUOutfitChanger.ini. Install while the game is closed.
author=w1zr
